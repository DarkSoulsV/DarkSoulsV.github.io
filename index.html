<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS/IS 190 Network Clock — Galaxy</title>
<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: Arial, Helvetica, sans-serif;
    }

    .clock-shell {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 240px;
        overflow: hidden;
        border-radius: 16px;
        background:
            radial-gradient(circle at 50% 20%, rgba(45,103,170,0.14), transparent 42%),
            linear-gradient(180deg, #07101b 0%, #0a1320 55%, #07101b 100%);
        border: 2px solid rgba(88,166,255,0.45);
        box-shadow:
            inset 0 0 30px rgba(88,166,255,0.08),
            0 8px 22px rgba(0,0,0,0.24);
    }

    canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }

    .overlay {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        text-align: center;
        padding: 18px;
    }

    .status {
        margin-bottom: 8px;
        color: #8fc7ff;
        font-size: clamp(11px, 2vw, 15px);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(88,166,255,0.3);
    }

    .time {
        min-width: 74%;
        padding: 7px 18px 5px;
        border-radius: 10px;
        color: #eaf6ff;
        background: rgba(4,11,21,0.64);
        border: 1px solid rgba(143,199,255,0.22);
        font-family: "Courier New", Consolas, monospace;
        font-size: clamp(38px, 10vw, 82px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.035em;
        text-shadow:
            0 0 7px rgba(161,220,255,0.95),
            0 0 20px rgba(56,139,253,0.62);
        box-shadow:
            inset 0 0 20px rgba(88,166,255,0.04),
            0 0 20px rgba(0,0,0,0.15);
    }

    .date {
        margin-top: 9px;
        color: #c9d7e6;
        font-size: clamp(13px, 2.5vw, 18px);
        font-weight: 600;
        letter-spacing: 0.035em;
        text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }

    .scanline {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: 13px;
        z-index: 3;
        height: 2px;
        opacity: 0.55;
        background: linear-gradient(
            90deg,
            transparent,
            rgba(88,166,255,0.25),
            rgba(88,166,255,0.9),
            rgba(88,166,255,0.25),
            transparent
        );
        animation: pulse 2.6s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 0.28; transform: scaleX(0.78); }
        50% { opacity: 0.72; transform: scaleX(1); }
    }
</style>
</head>
<body>

<div class="clock-shell" id="clockShell">
    <canvas id="gameCanvas" aria-hidden="true"></canvas>

    <div class="overlay">
        <div class="status">CS/IS 190 • NETWORK STATUS: ONLINE</div>
        <div class="time" id="time">--:--:--</div>
        <div class="date" id="date">Loading date...</div>
    </div>

    <div class="scanline"></div>
</div>

<script>
(() => {
    "use strict";

    /* =========================
       CLOCK
    ========================= */
    const timeEl = document.getElementById("time");
    const dateEl = document.getElementById("date");

    function updateClock() {
        const now = new Date();

        timeEl.textContent = new Intl.DateTimeFormat("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
        }).format(now);

        dateEl.textContent = new Intl.DateTimeFormat("en-US", {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        }).format(now);
    }

    updateClock();
    setInterval(updateClock, 1000);

    /* =========================
       RELAXED GALAXY SHOOTER
    ========================= */
    const shell = document.getElementById("clockShell");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let dpr = 1;
    let lastTime = 0;
    let totalTime = 0;
    let waveTimer = 0;

    let stars = [];
    let nebulaDots = [];
    let enemies = [];
    let bullets = [];
    let enemyBullets = [];
    let explosions = [];
    let shieldBursts = [];

    const ship = {
        x: 90,
        y: 120,
        targetX: 90,
        targetY: 120,
        w: 30,
        h: 18,
        speedX: 85,
        speedY: 125,
        fireCooldown: 0,
        maneuverTimer: 0,
        dodgeCooldown: 0,
        glow: 0
    };

    function rand(min, max) {
        return Math.random() * (max - min) + min;
    }

    function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
    }

    function resize() {
        const rect = shell.getBoundingClientRect();
        dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        createStars();
        createNebula();

        ship.x = width * 0.16;
        ship.y = height * 0.62;
        ship.targetX = ship.x;
        ship.targetY = ship.y;
        chooseNewManeuver();
    }

    function createStars() {
        stars = [];
        for (let i = 0; i < 95; i++) {
            stars.push({
                x: rand(0, width),
                y: rand(0, height),
                size: rand(0.7, 2.1),
                speed: rand(18, 95),
                alpha: rand(0.2, 0.9)
            });
        }
    }

    function createNebula() {
        nebulaDots = [];
        for (let i = 0; i < 28; i++) {
            nebulaDots.push({
                x: rand(0, width),
                y: rand(0, height * 0.92),
                r: rand(18, 55),
                a: rand(0.022, 0.065),
                hue: Math.random() < 0.5 ? "88,166,255" : "210,168,255"
            });
        }
    }

    function chooseNewManeuver() {
        // Keep the ship mostly on the left side, but allow meaningful X movement.
        // Avoid the large clock block in the center.
        const minX = width * 0.08;
        const maxX = width * 0.36;
        const minY = 44;
        const maxY = height - 42;

        ship.targetX = rand(minX, maxX);
        ship.targetY = rand(minY, maxY);
        ship.maneuverTimer = rand(1.4, 2.8);
    }

    function spawnEnemyWave() {
        const count = Math.random() < 0.78 ? 1 : 2;
        const baseX = width + rand(20, 70);

        for (let i = 0; i < count; i++) {
            const y = height * (0.20 + Math.random() * 0.62);
            enemies.push({
                x: baseX + i * rand(70, 105),
                y,
                baseY: y,
                w: rand(20, 29),
                h: rand(14, 21),
                vx: rand(92, 135),
                phase: rand(0, Math.PI * 2),
                amp: rand(8, 20),
                fire: rand(1.6, 3.2),
                type: Math.random() < 0.5 ? 0 : 1
            });
        }
    }

    function fireShip() {
        bullets.push({
            x: ship.x + ship.w + 3,
            y: ship.y + ship.h * 0.5,
            vx: 335
        });
        ship.glow = 0.18;
    }

    function fireEnemy(enemy) {
        enemyBullets.push({
            x: enemy.x - 2,
            y: enemy.y + enemy.h * 0.5,
            vx: -175,
            vy: rand(-16, 16)
        });
    }

    function makeExplosion(x, y, color="255,166,87") {
        for (let i = 0; i < 10; i++) {
            explosions.push({
                x, y,
                vx: rand(-65, 65),
                vy: rand(-65, 65),
                life: rand(0.28, 0.55),
                size: rand(2, 4),
                color
            });
        }
    }

    function makeShieldBurst(x, y) {
        shieldBursts.push({
            x, y,
            r: 8,
            life: 0.30
        });
    }

    function updateStars(dt) {
        for (const s of stars) {
            s.x -= s.speed * dt;
            if (s.x < -4) {
                s.x = width + rand(0, 50);
                s.y = rand(0, height);
                s.size = rand(0.7, 2.1);
                s.speed = rand(18, 95);
            }
        }
    }

    function moveToward(current, target, maxMove) {
        const d = target - current;
        if (Math.abs(d) <= maxMove) return target;
        return current + Math.sign(d) * maxMove;
    }

    function updateShip(dt) {
        ship.fireCooldown -= dt;
        ship.dodgeCooldown -= dt;
        ship.maneuverTimer -= dt;
        ship.glow = Math.max(0, ship.glow - dt);

        if (ship.maneuverTimer <= 0) {
            chooseNewManeuver();
        }

        // React to enemies by moving in BOTH axes.
        for (const e of enemies) {
            const dx = e.x - (ship.x + ship.w / 2);
            const dy = (e.y + e.h / 2) - (ship.y + ship.h / 2);

            if (dx > -10 && dx < 175 && Math.abs(dy) < 34) {
                ship.targetY += (ship.y < height / 2 ? 58 : -58);
                ship.targetX -= rand(18, 35);
                ship.targetY = clamp(ship.targetY, 44, height - 42);
                ship.targetX = clamp(ship.targetX, width * 0.07, width * 0.36);
                ship.maneuverTimer = rand(0.8, 1.4);
            }
        }

        // React to enemy bullets with diagonal dodge.
        for (const b of enemyBullets) {
            const dx = b.x - ship.x;
            const dy = b.y - (ship.y + ship.h / 2);

            if (dx > -10 && dx < 120 && Math.abs(dy) < 26) {
                const verticalPush = ship.y < height / 2 ? 48 : -48;
                const horizontalPush = Math.random() < 0.5 ? -30 : 25;

                ship.targetY = clamp(ship.targetY + verticalPush, 44, height - 42);
                ship.targetX = clamp(ship.targetX + horizontalPush, width * 0.07, width * 0.36);
                ship.maneuverTimer = rand(0.6, 1.1);
            }
        }

        // Smooth movement on both axes
        ship.x = moveToward(ship.x, ship.targetX, ship.speedX * dt);
        ship.y = moveToward(ship.y, ship.targetY, ship.speedY * dt);

        // Small drifting motion for a relaxed feel
        ship.y += Math.sin(totalTime * 1.1) * 4.2 * dt;
        ship.x += Math.sin(totalTime * 0.72 + 1.4) * 2.7 * dt;

        // Fire only occasionally
        const target = enemies.find(e =>
            e.x > ship.x + 45 &&
            e.x < width - 10 &&
            Math.abs((e.y + e.h / 2) - (ship.y + ship.h / 2)) < 34
        );

        if (target && ship.fireCooldown <= 0) {
            fireShip();
            ship.fireCooldown = rand(0.32, 0.52);
        }

        if (!target && ship.fireCooldown <= -0.25 && Math.random() < 0.012) {
            fireShip();
            ship.fireCooldown = rand(0.38, 0.62);
        }
    }

    function updateEnemies(dt) {
        for (const e of enemies) {
            e.x -= e.vx * dt;
            e.phase += dt * rand(1.2, 1.8);
            e.y = e.baseY + Math.sin(totalTime * 1.7 + e.phase) * e.amp;
            e.fire -= dt;

            if (e.fire <= 0 && e.x < width - 70 && e.x > ship.x + 140) {
                fireEnemy(e);
                e.fire = rand(2.0, 3.8);
            }
        }

        enemies = enemies.filter(e => e.x + e.w > -30);
    }

    function updateBullets(dt) {
        for (const b of bullets) b.x += b.vx * dt;
        bullets = bullets.filter(b => b.x < width + 30);

        for (const b of enemyBullets) {
            b.x += b.vx * dt;
            b.y += b.vy * dt;
        }
        enemyBullets = enemyBullets.filter(
            b => b.x > -30 && b.y > -20 && b.y < height + 20
        );
    }

    function hitTest() {
        // Ship bullets vs enemies
        for (let bi = bullets.length - 1; bi >= 0; bi--) {
            const b = bullets[bi];

            for (let ei = enemies.length - 1; ei >= 0; ei--) {
                const e = enemies[ei];

                if (
                    b.x > e.x &&
                    b.x < e.x + e.w &&
                    b.y > e.y &&
                    b.y < e.y + e.h
                ) {
                    makeExplosion(e.x + e.w / 2, e.y + e.h / 2);
                    bullets.splice(bi, 1);
                    enemies.splice(ei, 1);
                    break;
                }
            }
        }

        // Enemy bullets vs ship: shield only, no death
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            const b = enemyBullets[i];

            const hit =
                b.x > ship.x - 2 &&
                b.x < ship.x + ship.w + 2 &&
                b.y > ship.y - 2 &&
                b.y < ship.y + ship.h + 2;

            if (hit) {
                makeShieldBurst(ship.x + ship.w * 0.5, ship.y + ship.h * 0.5);
                enemyBullets.splice(i, 1);

                ship.targetY = clamp(
                    ship.targetY + (ship.y < height / 2 ? 50 : -50),
                    44,
                    height - 42
                );

                ship.targetX = clamp(
                    ship.targetX + (Math.random() < 0.5 ? -28 : 22),
                    width * 0.07,
                    width * 0.36
                );
            }
        }
    }

    function updateFX(dt) {
        for (const p of explosions) {
            p.life -= dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= 0.985;
            p.vy *= 0.985;
        }
        explosions = explosions.filter(p => p.life > 0);

        for (const s of shieldBursts) {
            s.life -= dt;
            s.r += 90 * dt;
        }
        shieldBursts = shieldBursts.filter(s => s.life > 0);
    }

    function update(dt) {
        totalTime += dt;

        waveTimer -= dt;
        if (waveTimer <= 0) {
            spawnEnemyWave();
            waveTimer = rand(1.2, 2.1);
        }

        updateStars(dt);
        updateShip(dt);
        updateEnemies(dt);
        updateBullets(dt);
        hitTest();
        updateFX(dt);
    }

    function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, width, height);
        sky.addColorStop(0, "#08111d");
        sky.addColorStop(0.5, "#0c1830");
        sky.addColorStop(1, "#08111d");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        for (const n of nebulaDots) {
            ctx.fillStyle = `rgba(${n.hue},${n.a})`;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
            ctx.fill();
        }

        for (const s of stars) {
            ctx.fillStyle = `rgba(219,234,254,${s.alpha})`;
            ctx.fillRect(s.x, s.y, s.size, s.size);
        }

        for (let i = 0; i < 4; i++) {
            const y = height * (0.22 + i * 0.16);
            ctx.strokeStyle = "rgba(88,166,255,0.045)";
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
        }
    }

    function drawShip() {
        const x = ship.x;
        const y = ship.y;

        ctx.globalAlpha = 0.55 + ship.glow * 1.5;
        ctx.fillStyle = "#79c0ff";
        ctx.beginPath();
        ctx.moveTo(x - 11, y + ship.h / 2);
        ctx.lineTo(x - 24 - Math.sin(totalTime * 18) * 3, y + 4);
        ctx.lineTo(x - 24 - Math.sin(totalTime * 18) * 3, y + ship.h - 4);
        ctx.closePath();
        ctx.fill();

        ctx.globalAlpha = 1;
        ctx.shadowColor = "#7ee787";
        ctx.shadowBlur = 10;
        ctx.fillStyle = "#7ee787";

        ctx.beginPath();
        ctx.moveTo(x, y + ship.h / 2);
        ctx.lineTo(x + 9, y);
        ctx.lineTo(x + ship.w - 7, y + 2);
        ctx.lineTo(x + ship.w, y + ship.h / 2);
        ctx.lineTo(x + ship.w - 7, y + ship.h - 2);
        ctx.lineTo(x + 9, y + ship.h);
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        ctx.fillRect(x + 5, y + 4, 13, 3);

        ctx.fillStyle = "#0a1626";
        roundedRect(x + 13, y + 5, 8, 8, 2.5);
        ctx.fill();

        ctx.fillStyle = "rgba(126,231,135,0.95)";
        ctx.beginPath();
        ctx.moveTo(x + 10, y + 4);
        ctx.lineTo(x + 17, y - 6);
        ctx.lineTo(x + 18, y + 6);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(x + 10, y + ship.h - 4);
        ctx.lineTo(x + 17, y + ship.h + 6);
        ctx.lineTo(x + 18, y + ship.h - 6);
        ctx.closePath();
        ctx.fill();
    }

    function drawEnemies() {
        for (const e of enemies) {
            ctx.save();
            ctx.globalAlpha = 0.68;
            ctx.shadowColor = e.type === 0 ? "#d2a8ff" : "#ffa657";
            ctx.shadowBlur = 8;
            ctx.fillStyle = e.type === 0 ? "#d2a8ff" : "#ffa657";

            ctx.beginPath();
            ctx.moveTo(e.x + e.w, e.y + e.h / 2);
            ctx.lineTo(e.x + e.w - 7, e.y + 2);
            ctx.lineTo(e.x + 6, e.y);
            ctx.lineTo(e.x, e.y + e.h / 2);
            ctx.lineTo(e.x + 6, e.y + e.h);
            ctx.lineTo(e.x + e.w - 7, e.y + e.h - 2);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.globalAlpha = 0.24;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(e.x + 4, e.y + 3, e.w - 9, 2.5);

            ctx.restore();
        }
    }

    function drawBullets() {
        for (const b of bullets) {
            ctx.save();
            ctx.strokeStyle = "#8fc7ff";
            ctx.lineWidth = 2.2;
            ctx.shadowColor = "#8fc7ff";
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(b.x - 7, b.y);
            ctx.lineTo(b.x + 6, b.y);
            ctx.stroke();
            ctx.restore();
        }

        for (const b of enemyBullets) {
            ctx.save();
            ctx.strokeStyle = "#ffb86b";
            ctx.lineWidth = 2;
            ctx.shadowColor = "#ffb86b";
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.moveTo(b.x + 5, b.y);
            ctx.lineTo(b.x - 5, b.y);
            ctx.stroke();
            ctx.restore();
        }
    }

    function drawExplosions() {
        for (const p of explosions) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.life * 2);
            ctx.fillStyle = `rgba(${p.color},1)`;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            ctx.restore();
        }
    }

    function drawShieldBursts() {
        for (const s of shieldBursts) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, s.life * 2.5);
            ctx.strokeStyle = "#79c0ff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    }

    function drawHUDAccent() {
        ctx.strokeStyle = "rgba(88,166,255,0.08)";
        ctx.strokeRect(10.5, 10.5, width - 21, height - 21);

        for (let i = 0; i < 7; i++) {
            const x = (totalTime * 70 + i * 130) % (width + 50) - 50;
            ctx.strokeStyle = "rgba(88,166,255,0.04)";
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x + 20, height);
            ctx.stroke();
        }
    }

    function render() {
        ctx.clearRect(0, 0, width, height);
        drawBackground();
        drawHUDAccent();
        drawEnemies();
        drawBullets();
        drawExplosions();
        drawShieldBursts();
        drawShip();
    }

    function loop(ts) {
        const dt = Math.min(0.034, (ts - (lastTime || ts)) / 1000);
        lastTime = ts;

        update(dt);
        render();

        requestAnimationFrame(loop);
    }

    window.addEventListener("resize", resize);

    resize();
    requestAnimationFrame(loop);
})();
</script>

</body>
</html>
