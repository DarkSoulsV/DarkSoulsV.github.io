<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS/IS 190 Network Clock</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        font-family: Arial, Helvetica, sans-serif;
    }

    .clock-shell {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 240px;
        overflow: hidden;
        border-radius: 16px;
        background:
            radial-gradient(circle at 50% 45%, rgba(31, 78, 121, 0.28), transparent 48%),
            linear-gradient(180deg, #0b1524 0%, #07101d 100%);
        border: 2px solid rgba(88, 166, 255, 0.45);
        box-shadow:
            inset 0 0 28px rgba(56, 139, 253, 0.08),
            0 8px 22px rgba(0, 0, 0, 0.22);
    }

    canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }

    .clock-content {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        text-align: center;
        padding: 18px;
    }

    .status {
        margin-bottom: 8px;
        color: #8fc7ff;
        font-size: clamp(11px, 2vw, 15px);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(88, 166, 255, 0.32);
    }

    .time {
        min-width: 74%;
        padding: 7px 18px 5px;
        border-radius: 10px;
        color: #eaf6ff;
        background: rgba(3, 10, 20, 0.62);
        border: 1px solid rgba(143, 199, 255, 0.22);
        font-family: "Courier New", Consolas, monospace;
        font-size: clamp(38px, 10vw, 82px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.035em;
        text-shadow:
            0 0 7px rgba(161, 220, 255, 0.95),
            0 0 20px rgba(56, 139, 253, 0.62);
        box-shadow:
            inset 0 0 20px rgba(88, 166, 255, 0.04),
            0 0 20px rgba(0, 0, 0, 0.15);
    }

    .date {
        margin-top: 9px;
        color: #c9d7e6;
        font-size: clamp(13px, 2.5vw, 18px);
        font-weight: 600;
        letter-spacing: 0.035em;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .network-line {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: 13px;
        z-index: 2;
        height: 2px;
        opacity: 0.55;
        background: linear-gradient(
            90deg,
            transparent,
            rgba(88, 166, 255, 0.25),
            rgba(88, 166, 255, 0.9),
            rgba(88, 166, 255, 0.25),
            transparent
        );
        animation: pulse 2.6s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% {
            opacity: 0.28;
            transform: scaleX(0.78);
        }
        50% {
            opacity: 0.72;
            transform: scaleX(1);
        }
    }
</style>
</head>

<body>

<div class="clock-shell" id="clockShell">
    <canvas id="tetrisCanvas" aria-hidden="true"></canvas>

    <div class="clock-content">
        <div class="status">CS/IS 190 &bull; NETWORK STATUS: ONLINE</div>
        <div class="time" id="time">--:--:--</div>
        <div class="date" id="date">Loading date...</div>
    </div>

    <div class="network-line"></div>
</div>

<script>
(() => {
    "use strict";

    /* =========================================================
       CLOCK
       ========================================================= */

    const timeElement = document.getElementById("time");
    const dateElement = document.getElementById("date");

    function updateClock() {
        const now = new Date();

        timeElement.textContent = new Intl.DateTimeFormat("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
        }).format(now);

        dateElement.textContent = new Intl.DateTimeFormat("en-US", {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
        }).format(now);
    }

    updateClock();
    setInterval(updateClock, 1000);


    /* =========================================================
       TETRIS BACKGROUND
       ========================================================= */

    const shell = document.getElementById("clockShell");
    const canvas = document.getElementById("tetrisCanvas");
    const ctx = canvas.getContext("2d");

    const COLS = 24;
    const ROWS = 12;

    let board = [];
    let activePiece = null;
    let cellWidth = 0;
    let cellHeight = 0;
    let width = 0;
    let height = 0;
    let dpr = 1;

    let lastFrame = 0;
    let dropAccumulator = 0;
    let spawnAccumulator = 0;

    const DROP_INTERVAL = 145;
    const SPAWN_DELAY = 950;
    const RESET_FILL_RATIO = 0.68;

    let resetOpacity = 0;
    let resetting = false;
    let resetHold = 0;

    const palette = [
        "#58a6ff",
        "#79c0ff",
        "#a5d6ff",
        "#7ee787",
        "#d2a8ff",
        "#ffa657",
        "#ff7b72"
    ];

    const SHAPES = [
        [[0,0],[1,0],[2,0],[3,0]],          // I
        [[0,0],[0,1],[1,1],[2,1]],          // J
        [[2,0],[0,1],[1,1],[2,1]],          // L
        [[0,0],[1,0],[0,1],[1,1]],          // O
        [[1,0],[2,0],[0,1],[1,1]],          // S
        [[1,0],[0,1],[1,1],[2,1]],          // T
        [[0,0],[1,0],[1,1],[2,1]]           // Z
    ];

    function makeBoard() {
        board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    }

    function resize() {
        const rect = shell.getBoundingClientRect();
        dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        cellWidth = width / COLS;
        cellHeight = height / ROWS;
    }

    function normalizeShape(shape) {
        const minX = Math.min(...shape.map(p => p[0]));
        const minY = Math.min(...shape.map(p => p[1]));
        return shape.map(([x, y]) => [x - minX, y - minY]);
    }

    function rotate(shape) {
        return normalizeShape(shape.map(([x, y]) => [y, -x]));
    }

    function randomPiece() {
        let shape = SHAPES[Math.floor(Math.random() * SHAPES.length)]
            .map(([x, y]) => [x, y]);

        const rotations = Math.floor(Math.random() * 4);
        for (let i = 0; i < rotations; i++) {
            shape = rotate(shape);
        }

        const pieceWidth = Math.max(...shape.map(p => p[0])) + 1;
        const x = Math.floor(Math.random() * Math.max(1, COLS - pieceWidth + 1));

        return {
            shape,
            x,
            y: -2,
            color: palette[Math.floor(Math.random() * palette.length)]
        };
    }

    function collides(piece, dx = 0, dy = 0) {
        for (const [sx, sy] of piece.shape) {
            const x = piece.x + sx + dx;
            const y = piece.y + sy + dy;

            if (x < 0 || x >= COLS || y >= ROWS) {
                return true;
            }

            if (y >= 0 && board[y][x] !== null) {
                return true;
            }
        }
        return false;
    }

    function merge(piece) {
        for (const [sx, sy] of piece.shape) {
            const x = piece.x + sx;
            const y = piece.y + sy;

            if (x >= 0 && x < COLS && y >= 0 && y < ROWS) {
                board[y][x] = piece.color;
            }
        }
    }

    function filledRatio() {
        let filled = 0;
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                if (board[y][x] !== null) filled++;
            }
        }
        return filled / (COLS * ROWS);
    }

    function topIsBlocked() {
        return board[0].some(Boolean) || board[1].some(Boolean);
    }

    function beginReset() {
        if (resetting) return;
        resetting = true;
        resetOpacity = 0;
        resetHold = 0;
        activePiece = null;
    }

    function updateReset(delta) {
        if (!resetting) return;

        if (resetHold < 180) {
            resetHold += delta;
            resetOpacity = Math.min(0.7, resetOpacity + delta / 320);
            return;
        }

        if (board.some(row => row.some(Boolean))) {
            makeBoard();
        }

        resetOpacity = Math.max(0, resetOpacity - delta / 470);

        if (resetOpacity <= 0.01) {
            resetOpacity = 0;
            resetting = false;
            spawnAccumulator = 0;
        }
    }

    function update(delta) {
        updateReset(delta);
        if (resetting) return;

        if (!activePiece) {
            spawnAccumulator += delta;

            if (spawnAccumulator >= SPAWN_DELAY) {
                activePiece = randomPiece();
                spawnAccumulator = 0;

                if (collides(activePiece)) {
                    beginReset();
                    return;
                }
            }
            return;
        }

        dropAccumulator += delta;

        if (dropAccumulator >= DROP_INTERVAL) {
            dropAccumulator = 0;

            if (!collides(activePiece, 0, 1)) {
                activePiece.y += 1;
            } else {
                merge(activePiece);
                activePiece = null;

                if (filledRatio() >= RESET_FILL_RATIO || topIsBlocked()) {
                    beginReset();
                }
            }
        }
    }

    function drawGrid() {
        ctx.save();
        ctx.lineWidth = 1;

        for (let x = 0; x <= COLS; x++) {
            const alpha = x % 4 === 0 ? 0.08 : 0.035;
            ctx.strokeStyle = `rgba(143,199,255,${alpha})`;
            ctx.beginPath();
            ctx.moveTo(x * cellWidth, 0);
            ctx.lineTo(x * cellWidth, height);
            ctx.stroke();
        }

        for (let y = 0; y <= ROWS; y++) {
            const alpha = y % 3 === 0 ? 0.07 : 0.03;
            ctx.strokeStyle = `rgba(143,199,255,${alpha})`;
            ctx.beginPath();
            ctx.moveTo(0, y * cellHeight);
            ctx.lineTo(width, y * cellHeight);
            ctx.stroke();
        }

        ctx.restore();
    }

    function drawBlock(gridX, gridY, color, falling = false) {
        if (gridY < 0) return;

        const x = gridX * cellWidth;
        const y = gridY * cellHeight;
        const gap = Math.max(1.2, Math.min(cellWidth, cellHeight) * 0.08);
        const w = cellWidth - gap * 2;
        const h = cellHeight - gap * 2;

        ctx.save();

        ctx.shadowColor = color;
        ctx.shadowBlur = falling ? 12 : 7;

        ctx.globalAlpha = falling ? 0.82 : 0.58;
        ctx.fillStyle = color;
        ctx.fillRect(x + gap, y + gap, w, h);

        ctx.shadowBlur = 0;
        ctx.globalAlpha = falling ? 0.5 : 0.27;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x + gap, y + gap, w, Math.max(2, h * 0.11));

        ctx.globalAlpha = falling ? 0.3 : 0.16;
        ctx.strokeStyle = "#ffffff";
        ctx.strokeRect(x + gap + 0.5, y + gap + 0.5, w - 1, h - 1);

        ctx.restore();
    }

    function drawBoard() {
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                const color = board[y][x];
                if (color) drawBlock(x, y, color, false);
            }
        }
    }

    function drawActivePiece() {
        if (!activePiece) return;

        for (const [sx, sy] of activePiece.shape) {
            drawBlock(
                activePiece.x + sx,
                activePiece.y + sy,
                activePiece.color,
                true
            );
        }
    }

    function drawAmbientPackets(time) {
        ctx.save();

        for (let i = 0; i < 5; i++) {
            const phase = ((time * 0.000035) + i / 5) % 1;
            const y = height * (0.16 + i * 0.16);
            const x = width * phase;

            ctx.globalAlpha = 0.18;
            ctx.fillStyle = "#79c0ff";
            ctx.beginPath();
            ctx.arc(x, y, 2.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalAlpha = 0.07;
            ctx.strokeStyle = "#79c0ff";
            ctx.beginPath();
            ctx.moveTo(Math.max(0, x - 55), y);
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        ctx.restore();
    }

    function render(time) {
        ctx.clearRect(0, 0, width, height);

        drawGrid();
        drawAmbientPackets(time);
        drawBoard();
        drawActivePiece();

        if (resetOpacity > 0) {
            ctx.save();
            ctx.globalAlpha = resetOpacity;
            ctx.fillStyle = "#8fc7ff";
            ctx.fillRect(0, 0, width, height);
            ctx.restore();
        }
    }

    function loop(timestamp) {
        const delta = Math.min(40, timestamp - (lastFrame || timestamp));
        lastFrame = timestamp;

        update(delta);
        render(timestamp);

        requestAnimationFrame(loop);
    }

    window.addEventListener("resize", resize);

    makeBoard();
    resize();
    requestAnimationFrame(loop);
})();
</script>

</body>
</html>
